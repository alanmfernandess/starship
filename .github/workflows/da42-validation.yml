name: DA42NG validation
on:
  push:
    paths:
      - 'da42/**'
      - '.github/workflows/da42-validation.yml'
  pull_request:
    paths:
      - 'da42/**'
      - '.github/workflows/da42-validation.yml'
permissions:
  contents: read
jobs:
  numerical-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: da42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate AFM tables, runway-limited takeoff mass, and Weight & Balance
        run: npm test

  mobile-ui-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: da42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Mobile UI: ten performance modules including Runway Analysis / MATOW
        run: python test_browser.py

  weight-and-balance-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: da42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify W&B optimizer, fuel input independence and manual restore on five mobile viewports
        run: python test_wb_browser.py
