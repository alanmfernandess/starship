name: DA42NG validation
on:
  push:
    paths:
      - 'da42/**'
      - '.github/workflows/da42-validation.yml'
  pull_request:
    paths:
      - 'da42/**'
      - '.github/workflows/da42-validation.yml'
permissions:
  contents: read
jobs:
  numerical-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: da42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify five modules: references, TAS holdouts, 850-point TAS grid and landing envelope
        run: npm test

  mobile-ui-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: da42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify five modules, Cruise ISA toggle and Landing segment chart on mobile
        run: python test_browser.py
