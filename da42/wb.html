<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101820"><meta name="description" content="DA42 NG Weight & Balance — experimental engineering study">
<title>DA42 NG · Weight & Balance</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<style>
:root{color-scheme:dark;--bg:#101820;--tile:#202d39;--txt:#f1f5f9;--label:#91a8b8;--blue:#56b9ee;--amber:#e7b46d;--line:#344652;--green:#67caa9;--red:#ff9e91}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
html,body{width:100%;height:100%;margin:0;padding:0;background:#fdfdfd;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;color:var(--txt)}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#app{height:100dvh;width:100%;display:flex;align-items:center;justify-content:center;background:#fdfdfd}
.phone{width:100%;max-width:480px;height:100dvh;min-height:610px;max-height:950px;overflow:hidden;background:var(--bg);position:relative;display:flex;flex-direction:column}
@media(min-width:550px){#app{padding:18px}.phone{width:min(420px,calc(100dvh*.59));height:min(860px,calc(100dvh - 36px));min-height:620px;border-radius:37px;box-shadow:0 14px 65px #0c121b32}}
.topbar{height:clamp(64px,9.8dvh,108px);flex:none;margin:0 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:80px minmax(0,1fr) 80px;align-items:start;padding-top:clamp(23px,3dvh,38px)}
.topbar h1{font-size:23px;font-weight:500;letter-spacing:-.5px;line-height:30px;text-align:center;margin:0}
.icon-btn{border:0;background:transparent;color:#9eb2c0;width:42px;height:36px;display:grid;place-items:center;padding:4px;border-radius:10px;text-decoration:none}
.header-back{border:0;background:transparent;color:#a9c2d2;display:flex;align-items:center;gap:5px;padding:4px 0;min-height:36px;font-size:11px;font-weight:650;letter-spacing:.35px}
.header-back .icon{width:18px;height:18px;flex:none}
.icon{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scroller{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain;padding:0 14px 12px}
.module-heading{display:flex;align-items:center;justify-content:space-between;margin:clamp(22px,4dvh,44px) 0 clamp(12px,2dvh,20px);font-size:13px;color:#b3c4d0;white-space:nowrap}
.accent{color:var(--blue)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,1.7dvh,18px);margin-bottom:clamp(12px,2dvh,24px)}
.field{min-width:0;height:clamp(94px,14dvh,158px);background:var(--tile);border-radius:16px;padding:15px 15px 13px;display:flex;flex-direction:column;justify-content:space-between}
.field label,.field .field-label{color:var(--label);font-size:clamp(10px,1.6dvh,15px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px}
.entry{display:grid;grid-template-columns:minmax(0,1fr) max-content;align-items:baseline;gap:6px;min-width:0}
.entry input{color:var(--txt);background:none;border:0;outline:none;width:100%;min-width:0;font-size:clamp(30px,4.7dvh,52px);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.7px}
.entry input{font-size:clamp(25px,4.1dvh,43px)}
.entry input:focus{outline:0}.field:focus-within{box-shadow:inset 0 0 0 1px var(--blue)}
.unit{font-size:15px;color:#89a6b9;white-space:nowrap;flex:none}
.open-load{width:100%;background:var(--tile);border:0;border-radius:16px;padding:15px;min-height:70px;margin-bottom:clamp(12px,2dvh,24px);display:flex;align-items:center;justify-content:space-between;text-align:left;color:var(--txt)}
.open-load .main{display:block;font-size:13px;font-weight:600;color:var(--txt);letter-spacing:.15px}
.optimize-row{display:flex;gap:9px;margin:-7px 0 clamp(12px,2dvh,22px);align-items:stretch}
.optimize-button{flex:1;min-height:46px;border:1px solid #40738f;border-radius:13px;color:#8dd2ff;background:#203a4c;font-weight:600;letter-spacing:.4px;font-size:13px}
.optimize-button:active{background:#2b5069}
.optimize-feedback{flex:1;min-width:0;align-self:center;color:var(--amber);font-size:11px;text-align:right}
.field input[readonly],.sheet-row input[readonly]{color:#aac2d1;cursor:default}

.result{background:var(--tile);border-radius:19px;padding:15px 15px 16px;min-height:0}
.result-head{display:flex;align-items:center;justify-content:space-between;color:#afc2ce;font-size:13px;letter-spacing:.25px}.result-head .icon{color:var(--blue);width:19px;height:19px}
.primary{display:flex;align-items:baseline;gap:10px;margin-top:13px}
.number{font-size:45px;line-height:1.09;letter-spacing:-1.6px;font-weight:550;font-variant-numeric:tabular-nums}.primary-unit{font-size:16px;color:#afc2ce}
.standalone-status{display:flex;align-items:center;gap:7px;color:var(--green);font-size:11px;margin-top:7px}.standalone-status.bad{color:var(--red)}
.graph{width:100%;display:block;margin:0 0 5px;max-height:210px;overflow:visible}
.graph text{font-family:inherit}
.legend{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#a9bdc9;margin-bottom:5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.line{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:13px;color:#96abb9;border-top:1px solid var(--line);padding:10px 0 0;margin-top:8px}.line strong{color:var(--txt);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.metric{background:#1a2732;border-radius:12px;padding:10px;min-width:0}
.metric label{display:block;font-size:10px;color:var(--label);margin-bottom:5px}.metric b{font-size:16px;font-weight:500}
.notice{min-height:12px;margin:11px 0 2px;text-align:center;color:#8ba2b2;font-size:9px;letter-spacing:.15px}.notice.bad{color:var(--amber)}
.bottom{height:65px;flex:0 0 auto;display:flex;justify-content:space-around;align-items:center;padding:3px 24px 10px;background:var(--bg)}
.nav-btn{color:#839bae;background:none;border:0;width:46px;height:47px;display:grid;place-items:center;border-radius:10px}.nav-btn.active{color:var(--blue)}
.sheet-backdrop{position:absolute;inset:0;background:#050b12b8;z-index:4;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:82%;overflow:auto;background:#17232e;border-radius:24px 24px 0 0;padding:20px 19px max(24px,env(safe-area-inset-bottom));overscroll-behavior:contain}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:13px;border-bottom:1px solid var(--line);margin-bottom:15px}.sheet-head h2{font-size:17px;margin:0;font-weight:500}
.sheet-head .close{border:0;background:transparent;color:#adc2d0;font-size:11px;font-weight:650;letter-spacing:.35px;padding:7px 0}
.section-title{color:#7cbde2;font-size:11px;font-weight:600;margin:20px 0 9px;letter-spacing:.3px}
.sheet-row{display:flex;align-items:center;gap:9px;min-height:55px;border-bottom:1px solid #304251;padding:7px 0}.sheet-row label{font-size:12px;flex:1;color:#b4c4cf}
.sheet-row input{width:92px;max-width:37%;background:#202d39;border:1px solid #395061;border-radius:9px;padding:10px 8px;color:#f1f5f9;font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
.sheet-row .unit{width:36px;text-align:right;font-size:11px}
.s-note{color:#8fa5b5;font-size:11px;line-height:1.5;margin:10px 0}
.sheet .action,.sheet a.action{width:100%;min-height:45px;padding:12px;background:#243c4d;border:1px solid #456777;border-radius:11px;color:#dcebf4;display:block;text-align:center;text-decoration:none;font-size:12px;margin:12px 0}
.case{padding:11px 0;border-bottom:1px solid #304251}.case .name{font-size:11px;color:#a9bfcd}.case .value{display:flex;justify-content:space-between;margin-top:6px;font-size:14px;gap:9px}.case .value b{font-weight:500}
.error{color:var(--red)}.good{color:var(--green)}.warn{color:var(--amber)}
@media(max-width:355px){.field{height:87px;padding:13px 12px 9px}.entry input{font-size:27px}.module-heading{margin-top:20px}}
@media(max-height:730px){.topbar{height:72px;padding-top:17px}.module-heading{margin-top:15px;margin-bottom:12px}.field{height:87px}.fields{margin-bottom:10px}.result{padding-top:14px}.bottom{height:57px}}
</style></head>
<body><div id="app"></div><script src="./wb-engine.js"></script><script src="./wb-optimizer.js"></script><script>
'use strict';
const E=window.WBEngine,OPT=window.WBOptimizer,AUTO_KEY='da42-wb-optimized-v1',MANUAL_KEY='da42-wb-pre-auto-manual-v1',KEY='da42-wb-profile-v1';
const icons={
 back:'<path d="m15 5-7 7 7 7"/>',
 menu:'<path d="M5 7h14M5 12h9M5 17h6"/>',
 settings:'<path d="M4 7h16M4 17h16M9 3v8M15 13v8"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="17" r="2"/>',
 calculator:'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 7h8M9 11h1M14 11h1M9 15h1M14 15h1M9 19h1M14 19h1"/>',
 chart:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M6 15l4-4 3 3 5-6"/>',
 history:'<path d="M3 12a9 9 0 1 0 3-7M3 4v5h5M12 7v5l3 2"/>',
 next:'<path d="m9 5 7 7-7 7"/>',
 check:'<path d="m4 13 5 5L20 6"/>',
 plane:'<path d="m3 19 18-14M8 10l-1-6M14 14l7 1"/>'
};
const icon=name=>'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">'+icons[name]+'</svg>';
const el=s=>document.querySelector(s);
const format=(x,d=0)=>typeof x==='number'&&Number.isFinite(x)?new Intl.NumberFormat('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d}).format(x):'—';
const inputFormat=(x,d=0)=>typeof x==='number'&&Number.isFinite(x)?
 new Intl.NumberFormat('en-US',{useGrouping:false,minimumFractionDigits:d,maximumFractionDigits:d}).format(x):'';
let profile=E.EXAMPLE;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&typeof saved==='object'){const clean=Object.fromEntries(E.INPUTS.filter(k=>Object.prototype.hasOwnProperty.call(saved,k)).map(k=>[k,saved[k]]));profile={...E.EXAMPLE,...clean}}}catch(e){}
let optimizedMode=false;
try{optimizedMode=localStorage.getItem(AUTO_KEY)==='true'}catch(e){}
let optimizeMessage='';
let previousManual=null;
try{const saved=JSON.parse(localStorage.getItem(MANUAL_KEY));if(saved&&typeof saved==='object'&&OPT.ADJUSTABLE.every(k=>Object.prototype.hasOwnProperty.call(saved,k)))previousManual=saved}catch(e){}
let model=E.calculate(profile);
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
const profilesInputs=[
 ['nose','NOSE BAGGAGE','kg'],['cabin','CABIN BAGGAGE','kg'],['extension','EXTENSION','kg'],
 ['deice','DE-ICING FLUID','kg'],['mainL','MAIN LEFT','kg'],['mainR','MAIN RIGHT','kg'],
 ['auxL','AUX LEFT','kg'],['auxR','AUX RIGHT','kg'],
 ['emptyMass','EMPTY WEIGHT','kg'],['emptyMoment','EMPTY MOMENT','kg·m']
];
function card(key,label){
 const v=profile[key];
 return '<div class="field"><label for="val-'+key+'">'+label+'</label><div class="entry"><input data-wb="'+key+'" id="val-'+key+'" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="'+esc(inputFormat(v,0))+'" aria-label="'+label+' kg"'+(optimizedMode&&OPT.ADJUSTABLE.includes(key)?' readonly aria-readonly="true"':'')+'><span class="unit">kg</span></div></div>';
}
function coords(m,c){const width=270,axisL=2.33,axisR=2.51;return [31+(c-axisL)/(axisR-axisL)*width,181-(m-1500)/450*160]}
function envelope(){
 const poly=[[1510,2.357],[1900,2.418],[1900,2.480],[1700,2.480],[1510,2.460]].map(([m,c])=>coords(m,c).map(v=>v.toFixed(2)).join(',')).join(' ');
 const lines=[1510,1700,1900].map(m=>{const y=coords(m,2.33)[1].toFixed(2);return '<path d="M31 '+y+'H301" stroke="#425362" stroke-width=".8"/><text x="26" y="'+(+y+4)+'" text-anchor="end" font-size="10" fill="#9ab0bf">'+m+'</text>'}).join('');
 const columns=[2.35,2.40,2.45,2.50].map(c=>{const x=coords(1600,c)[0].toFixed(2);return '<path d="M'+x+' 21V181" stroke="#3b4b59" stroke-width=".8"/><text x="'+x+'" y="198" text-anchor="middle" font-size="10" fill="#91a8b8">'+format(c,2)+'</text>'}).join('');
 let path='',points='';
 if(model.ok){
  const plotted=[['zeroFuel','#e7b46d','ZERO FUEL'],['takeoff','#56b9ee','TAKEOFF']];
  if(plotted.length>1)path='<path d="'+plotted.map(([k],i)=>{const [x,y]=coords(model[k].mass,model[k].cg);return (i?'L':'M')+x.toFixed(2)+' '+y.toFixed(2)}).join(' ')+'" fill="none" stroke="#e7b46d" stroke-dasharray="4 4" stroke-width="1.7"/>';
  points=plotted.map(([k,color,title])=>{const [x,y]=coords(model[k].mass,model[k].cg);const fill=model[k].cgOK?color:'#ff9e91';return '<circle cx="'+x.toFixed(2)+'" cy="'+y.toFixed(2)+'" r="4.8" fill="'+fill+'" stroke="#202d39" stroke-width="2"><title>'+title+'</title></circle>'}).join('');
 }
 return '<svg class="graph" viewBox="0 0 320 216" role="img" aria-label="CG envelope, center of gravity versus flight mass">'+lines+columns+'<polygon points="'+poly+'" fill="#56b9ee" fill-opacity=".10" stroke="#56b9ee" stroke-width="2"/>'+path+points+'</svg>';
}
function content(){
 const sc=model.ok?model.statuses:{};
 const metrics=model.ok?'<div class="metrics"><div class="metric"><label>ZFW</label><b>'+format(model.zeroFuel.mass,0)+' kg</b></div><div class="metric"><label>TOW</label><b>'+format(model.takeoff.mass,0)+' kg</b></div></div>':'<div class="metrics"><div class="metric"><label>CHECK INPUTS</label><b>—</b></div></div>';
 const massState=model.ok?(sc.massOK?'WEIGHT WITHIN LIMITS':'WEIGHT LIMIT EXCEEDED'):'CHECK INPUTS';
 return '<div class="phone"><header class="topbar"><button class="header-back" id="menu" type="button" aria-label="Back · Performance menu">'+icon('back')+'<span>BACK</span></button><h1>DA42 NG</h1><button class="icon-btn" id="settings" aria-label="Configurações da aeronave">'+icon('settings')+'</button></header>'+
 '<main class="scroller" id="scroller"><div class="module-heading"><span>WEIGHT &amp; BALANCE</span><span class="accent">CG ENVELOPE</span></div>'+
 '<div class="fields">'+card('pilot','PILOT')+card('copilot','COPILOT')+card('pax1','PASSENGER 1')+card('pax2','PASSENGER 2')+'</div>'+
 '<button class="open-load" id="edit-load" aria-label="BAGGAGE &amp; FUEL"><span class="main">BAGGAGE &amp; FUEL</span>'+icon('next')+'</button>'+
 '<div class="optimize-row"><button id="optimize" class="optimize-button" type="button">OTIMIZAR</button>'+(optimizeMessage?'<span id="optimize-status" class="optimize-feedback" role="alert">'+esc(optimizeMessage)+'</span>':'')+'</div>'+
 '<section class="result" aria-live="polite"><div id="envelope">'+envelope()+'</div><div class="legend"><span><i class="dot" style="background:#e7b46d"></i>ZFW</span><span><i class="dot" style="background:#56b9ee"></i>TOW</span></div>'+
 '<div id="mass-check" class="standalone-status '+(sc.massOK?'':'bad')+'">'+(model.ok?massState:'—')+'</div><div id="metrics">'+metrics+'</div>'+
 '</section><div class="notice" id="notice">NOT FOR FLIGHT</div></main>'+
 '<nav class="bottom"><button class="nav-btn active" id="nav-input" aria-label="Ocupantes">'+icon('calculator')+'</button>'+
 '<button class="nav-btn" id="nav-chart" aria-label="Envelope CG">'+icon('chart')+'</button>'+
 '<button class="nav-btn" id="nav-scenarios" aria-label="Cenários de combustível e degelo">'+icon('history')+'</button>'+
 '<button class="nav-btn" id="nav-settings" aria-label="Dados da aeronave">'+icon('settings')+'</button></nav></div>';
}
function parseNumber(text){
 let v=String(text).trim().replace(/\s/g,'');
 if(!v)return NaN;
 if(v.includes(',')&&v.includes('.')){
  v=v.lastIndexOf('.')>v.lastIndexOf(',')?v.replaceAll(',',''):v.replaceAll('.','').replace(',','.');
 }else if(v.includes(',')){
  v=/^[+-]?\d{1,3}(,\d{3})+$/.test(v)?v.replaceAll(',',''):v.replace(',','.');
 }else if(/^[+-]?\d{1,3}(\.\d{3})+$/.test(v)){
  v=v.replaceAll('.','');
 }
 return /^[-+]?\d+(\.\d+)?$/.test(v)?Number(v):NaN;
}
function store(){
 if(E.validate(profile).length===0){try{localStorage.setItem(KEY,JSON.stringify(profile))}catch(e){}}
}
function recalc(){
 model=E.calculate(profile);
 const set=(s,v)=>{const e=el(s);if(e)e.innerHTML=v};
 set('#envelope',envelope());
 set('#mass-check','<span class="'+(model.ok?(model.statuses.massOK?'good':'error'):'error')+'">'+(model.ok?(model.statuses.massOK?'WEIGHT WITHIN LIMITS':'WEIGHT LIMIT EXCEEDED'):'CHECK INPUTS')+'</span>');
 set('#metrics',model.ok?'<div class="metrics"><div class="metric"><label>ZFW</label><b>'+format(model.zeroFuel.mass,0)+' kg</b></div><div class="metric"><label>TOW</label><b>'+format(model.takeoff.mass,0)+' kg</b></div></div>':'');
 const notice=el('#notice');if(notice){notice.textContent=model.ok?'NOT FOR FLIGHT':model.errors.join(' · ');notice.classList.toggle('bad',!model.ok||!model.statuses.massOK||!model.statuses.cgOK)}
 const optStatus=el('#optimize-status');if(optStatus)optStatus.textContent=optimizeMessage;
 store();
}
function bindInputs(root=document){
 root.querySelectorAll('[data-wb]').forEach(inp=>{
  inp.addEventListener('input',()=>{
   const k=inp.dataset.wb;
   if(optimizedMode&&OPT.ADJUSTABLE.includes(k))return;
   profile={...profile,[k]:parseNumber(inp.value)};
   recalc();
  });
 });
}
function sheet(type){
 const titles={load:'LOAD CONFIGURATION',settings:'AIRCRAFT PROFILE',scenarios:'FUEL & DE-ICE',modules:'PERFORMANCE'};
 const sections={
  load:[
   ['BAGGAGE',['nose','cabin','extension']],
   ['FUEL · USEABLE WEIGHT',['mainL','mainR','auxL','auxR']],
   ['DE-ICING',['deice']]
  ],
  settings:[['EMPTY AIRCRAFT',['emptyMass','emptyMoment']]]
 };
 let body='';
 if(type==='load'||type==='settings'){
  for(const [title,keys] of sections[type]){
   body+='<div class="section-title">'+title+'</div>';
   for(const k of keys){
    const field=profilesInputs.find(([id])=>id===k);
    body+='<div class="sheet-row"><label for="sheet-'+k+'">'+field[1]+'</label><input data-wb="'+k+'" id="sheet-'+k+'" inputmode="decimal" autocomplete="off" type="text" value="'+(profile[k]===null?'':esc(inputFormat(profile[k],1)))+'" placeholder="—" aria-label="'+field[1]+'"'+(optimizedMode&&OPT.ADJUSTABLE.includes(k)?' readonly aria-readonly="true"':'')+'><span class="unit">'+field[2]+'</span></div>';
   }
  }
  if(type==='settings')body+=(optimizedMode&&previousManual?'<button class="action" id="restore-manual">CARGA MANUAL</button>':'')+'<button class="action" id="reset-example">AFM EXAMPLE</button>';
 }
 if(type==='scenarios'){
  const title='';
  body=title+(model.ok?model.scenarios.map(c=>'<div class="case"><div class="name">'+c.name+'</div><div class="value"><b>'+format(c.mass,1)+' kg</b><span class="'+(c.cgOK?'good':'error')+'">'+format(c.cg,3)+' m · '+(c.cgOK?'CG OK':'CG OUT')+'</span></div></div>').join(''):'<p class="error">'+model.errors.join(', ')+'</p>');
  if(model.ok)body+='<div class="section-title">LOADED CONDITION</div><div class="case"><div class="value"><span>ZFW</span><b>'+format(model.zeroFuel.mass,0)+' kg</b></div></div><div class="case"><div class="value"><span>TOW</span><b>'+format(model.takeoff.mass,0)+' kg</b></div></div>';
 }
 if(type==='modules')body='<a class="action" href="./flight.html">FLIGHT PLAN</a><a class="action" href="./index.html?calculator=1">PERFORMANCE</a><a class="action" href="./wb.html">WEIGHT &amp; BALANCE</a>';
 const d=document.createElement('div');d.className='sheet-backdrop';d.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="'+titles[type]+'"><div class="sheet-head"><h2>'+titles[type]+'</h2><button class="close" aria-label="Back">BACK</button></div>'+body+'</div>';
 el('.phone').appendChild(d);
 d.addEventListener('click',ev=>{if(ev.target===d)d.remove()});
 d.querySelector('.close').onclick=()=>d.remove();
 bindInputs(d);
 const restore=d.querySelector('#restore-manual');if(restore)restore.onclick=()=>{
  if(previousManual)profile={...profile,...previousManual};
  optimizedMode=false;optimizeMessage='';
  try{localStorage.removeItem(AUTO_KEY);localStorage.removeItem(MANUAL_KEY)}catch(e){}
  previousManual=null;d.remove();render();
 };
 const reset=d.querySelector('#reset-example');if(reset)reset.onclick=()=>{profile={...E.EXAMPLE};optimizedMode=false;previousManual=null;optimizeMessage='';model=E.calculate(profile);try{localStorage.removeItem(KEY);localStorage.removeItem(AUTO_KEY);localStorage.removeItem(MANUAL_KEY)}catch(e){}d.remove();render()};
}
function render(){
 model=E.calculate(profile);el('#app').innerHTML=content();bindInputs();
 el('#menu').onclick=()=>sheet('modules');
 el('#settings').onclick=()=>sheet('settings');
 el('#edit-load').onclick=()=>sheet('load');
 el('#optimize').onclick=()=>{
  const found=OPT.optimize(profile,E);
  if(!found.ok){optimizeMessage=found.reason&&(/COMBUSTÍVEL|PERFIL|DADOS/.test(found.reason))?'DADOS INVÁLIDOS':'SEM SOLUÇÃO';render();return}
  if(!optimizedMode){
   previousManual=Object.fromEntries(OPT.ADJUSTABLE.map(k=>[k,profile[k]]));
   try{localStorage.setItem(MANUAL_KEY,JSON.stringify(previousManual))}catch(e){}
  }
  profile={...profile,...found.suggested};
  optimizedMode=true;
  optimizeMessage='';
  try{localStorage.setItem(AUTO_KEY,'true')}catch(e){}
  render();
 };
 el('#nav-input').onclick=()=>{el('#scroller').scrollTo({top:0,behavior:'smooth'})};
 el('#nav-chart').onclick=()=>el('.result').scrollIntoView({behavior:'smooth',block:'start'});
 el('#nav-scenarios').onclick=()=>sheet('scenarios');
 el('#nav-settings').onclick=()=>sheet('settings');
 recalc();
}
window.WBApp={get profile(){return profile},get model(){return model},get optimizedMode(){return optimizedMode},render,sheet,optimize:()=>OPT.optimize(profile,E)};
render();
if('serviceWorker'in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
