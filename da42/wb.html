<style>

.sheet-head .close{border:0;background:transparent;color:#adc2d0;font-size:11px;font-weight:650;letter-spacing:.35px;padding:7px 0}
.section-title{color:#7cbde2;font-size:11px;font-weight:600;margin:20px 0 9px;letter-spacing:.3px}
.sheet-row{display:flex;align-items:center;gap:9px;min-height:55px;border-bottom:1px solid #304251;padding:7px 0}.sheet-row label{font-size:12px;flex:1;color:#b4c4cf}
.sheet-row input{width:92px;max-width:37%;background:#202d39;border:1px solid #395061;border-radius:9px;padding:10px 8px;color:#f1f5f9;font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
.sheet-row .unit{width:36px;text-align:right;font-size:11px}
.s-note{color:#8fa5b5;font-size:11px;line-height:1.5;margin:10px 0}
.sheet .action,.sheet a.action{width:100%;min-height:45px;padding:12px;background:#243c4d;border:1px solid #456777;border-radius:11px;color:#dcebf4;display:block;text-align:center;text-decoration:none;font-size:12px;margin:12px 0}
.case{padding:11px 0;border-bottom:1px solid #304251}.case .name{font-size:11px;color:#a9bfcd}.case .value{display:flex;justify-content:space-between;margin-top:6px;font-size:14px;gap:9px}.case .value b{font-weight:500}
.error{color:var(--red)}.good{color:var(--green)}.warn{color:var(--amber)}
@media(max-width:355px){.field{height:87px;padding:13px 12px 9px}.entry input{font-size:27px}.module-heading{margin-top:20px}}
@media(max-height:730px){.topbar{height:72px;padding-top:17px}.module-heading{margin-top:15px;margin-bottom:12px}.field{height:87px}.fields{margin-bottom:10px}.result{padding-top:14px}.bottom{height:57px}}

/* SimBrief reconciliation is separate from hypothetical CG optimization. */
.wb-ofp{background:#1c303f;border:1px solid #375365;border-radius:13px;padding:12px 13px;margin:0 0 12px}
.wb-ofp-title{font-size:11px;letter-spacing:.3px;font-weight:700;color:#b9d7e9;margin-bottom:11px}

.wb-ofp-cell strong{display:block;margin-top:4px;font-size:clamp(13px,3.6vw,17px);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.wb-ofp-status{margin-top:10px;padding-top:10px;border-top:1px solid #375365;font-size:10px;line-height:1.5;color:#e7b46d;overflow-wrap:anywhere}
.wb-ofp-status.equal{color:#79cf9d}
@media(max-width:355px){.wb-ofp{padding:10px}.wb-ofp-grid{gap:4px}.wb-ofp-cell strong{font-size:13px}}

.loading-sources{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;padding:4px;background:#17242f;border:1px solid #334b5b;border-radius:12px;margin:-3px 0 14px}
.loading-source{min-width:0;min-height:40px;padding:8px 2px;border:1px solid transparent;border-radius:9px;background:transparent;color:#a4bece;font-weight:650;font-size:10px;letter-spacing:.1px}
.loading-source.active{background:#203a4c;border-color:#56b9ee;color:#86d2ff}
.loading-source:disabled{opacity:.35;cursor:default}
.loading-summary{margin:0 0 12px;border-radius:13px;padding:12px;background:#202d39}
.loading-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:stretch;min-width:0}
.loading-metric{min-width:0;display:grid;grid-template-rows:15px 26px;justify-items:center;align-items:center;text-align:center}
.loading-metric span{display:block;width:100%;color:#92aabb;font-size:10px;line-height:15px;letter-spacing:.3px;text-align:center}
.loading-metric strong{display:block;width:100%;min-width:0;color:#edf6fc;font-size:clamp(16px,4vw,20px);line-height:26px;font-weight:550;font-variant-numeric:tabular-nums;letter-spacing:-.25px;white-space:nowrap;text-align:center}

.loading-note.good{color:#67caa9}
@media(max-width:355px){.loading-source{font-size:9px}.loading-summary{padding:11px}.loading-metrics{gap:4px}.loading-metric strong{font-size:16px;letter-spacing:-.4px}}

.topbar-placeholder{width:42px;height:36px}
.page-back{margin:17px 0 11px;padding-top:13px;border-top:1px solid var(--line)}
.page-back button,.sheet-return{display:flex;align-items:center;justify-content:center;width:100%;min-height:58px;padding:12px 14px;border:1px solid #456b80;border-radius:13px;background:#243c4d;color:#dcebf4;font-size:14px;font-weight:700;letter-spacing:.25px}

<link rel="stylesheet" href="./ui-buttons.css"></head>
<body><div id="app"></div><script src="./wb-engine.js"></script><script src="./wb-optimizer.js"></script><script src="./loading-profile.js"></script><script>
'use strict';
const checklistReturn=/[?&]returnToReview=1(?:&|$)/.test(location.search||'');
const checklistItem=(location.search||'').match(/[?&]reviewItem=([a-zA-Z0-9]+)(?:&|$)/);
const checklistReturnUrl='./flight.html?review=1'+(checklistItem?'&reviewItem='+checklistItem[1]:'');
const reviewPlan=(()=>{
 try{
  const p=JSON.parse(sessionStorage.getItem('aero-ui-flight-plan-v1')||'null');
  return checklistReturn&&p?.aircraft==='DA42'&&!p.mismatch&&Number.isFinite(p.takeoffWeight)?p:null;
 }catch{return null}
})();
const Load=window.LoadingProfile,E=window.WBEngine,OPT=window.WBOptimizer,AUTO_KEY='da42-wb-optimized-v1',MANUAL_KEY='da42-wb-pre-auto-manual-v1',KEY='da42-wb-profile-v1';
const icons={
 back:'<path d="m15 5-7 7 7 7"/>',
 menu:'<path d="M5 7h14M5 12h9M5 17h6"/>',
 settings:'<path d="M4 7h16M4 17h16M9 3v8M15 13v8"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="17" r="2"/>',
 calculator:'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 7h8M9 11h1M14 11h1M9 15h1M14 15h1M9 19h1M14 19h1"/>',
 chart:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M6 15l4-4 3 3 5-6"/>',
 history:'<path d="M3 12a9 9 0 1 0 3-7M3 4v5h5M12 7v5l3 2"/>',
 next:'<path d="m9 5 7 7-7 7"/>',
 check:'<path d="m4 13 5 5L20 6"/>',
 plane:'<path d="m3 19 18-14M8 10l-1-6M14 14l7 1"/>'
};
Object.assign(icons,{
 plan:'<path d="M3 3h18v18H3zM7 8h10M7 12h10M7 16h6"/>',
 summary:'<path d="M4 20V11M10 20V5M16 20v-9M22 20V8"/>',
 modules:'<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>',
 more:'<path d="M5 12h.1M12 12h.1M19 12h.1"/>'
});
const icon=name=>'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">'+icons[name]+'</svg>';
const el=s=>document.querySelector(s);
const format=(x,d=0)=>typeof x==='number'&&Number.isFinite(x)?new Intl.NumberFormat('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d}).format(x):'—';
const inputFormat=(x,d=0)=>typeof x==='number'&&Number.isFinite(x)?
 new Intl.NumberFormat('en-US',{useGrouping:false,minimumFractionDigits:d,maximumFractionDigits:d}).format(x):'';
let profile=E.EXAMPLE;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&typeof saved==='object'){const clean=Object.fromEntries(E.INPUTS.filter(k=>Object.prototype.hasOwnProperty.call(saved,k)).map(k=>[k,saved[k]]));profile={...E.EXAMPLE,...clean}}}catch(e){}
let optimizedMode=false;
try{optimizedMode=localStorage.getItem(AUTO_KEY)==='true'}catch(e){}
let optimizeMessage='';
let previousManual=null;
try{const saved=JSON.parse(localStorage.getItem(MANUAL_KEY));if(saved&&typeof saved==='object'&&OPT.ADJUSTABLE.every(k=>Object.prototype.hasOwnProperty.call(saved,k)))previousManual=saved}catch(e){}
let sourceMode=Load.mode(localStorage,Load.plan(sessionStorage,localStorage));
let model=E.calculate(profile);
const planRef=()=>Load.plan(sessionStorage,localStorage);
const fuelRef=()=>planRef()?Load.distribute(planRef().plannedFuel):null;
function resolvedModel(){
 const fuel=fuelRef();
 return sourceMode==='simbrief'&&fuel?.ok?E.calculate({...profile,...fuel.tanks}):E.calculate(profile);
}
function syncActive(){
 try{return Load.sync(localStorage,planRef(),sourceMode==='simbrief'?null:E.calculate(profile),sourceMode)}catch{return null}
}
function selectSource(value){
 if(value==='simbrief'&&!planRef()){
  location.assign('./flight.html?import=1&returnToWB=1');return;
 }
 if(value==='optimized'){runOptimize();return}
 if(optimizedMode&&value==='manual'){
  if(previousManual)profile={...profile,...previousManual};
  previousManual=null;optimizedMode=false;optimizeMessage='';
  try{localStorage.removeItem(AUTO_KEY);localStorage.removeItem(MANUAL_KEY)}catch{}
 }
 sourceMode=value;
 Load.setMode(localStorage,value,planRef());
 render();
}
function runOptimize(){
 const found=OPT.optimize(profile,E);
 if(!found.ok){optimizeMessage=found.reason&&(/COMBUSTÍVEL|PERFIL|DADOS/.test(found.reason))?'DADOS INVÁLIDOS':'SEM SOLUÇÃO';render();return}
 if(!optimizedMode){
  previousManual=Object.fromEntries(OPT.ADJUSTABLE.map(k=>[k,profile[k]]));
  try{localStorage.setItem(MANUAL_KEY,JSON.stringify(previousManual))}catch{}
 }
 profile={...profile,...found.suggested};
 optimizedMode=true;sourceMode='optimized';
 Load.setMode(localStorage,'optimized',planRef());
 optimizeMessage='';
 try{localStorage.setItem(AUTO_KEY,'true')}catch{}
 render();
}

function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
const profilesInputs=[
 ['nose','NOSE BAGGAGE','kg'],['cabin','CABIN BAGGAGE','kg'],['extension','EXTENSION','kg'],
 ['deice','DE-ICING FLUID','kg'],['mainL','MAIN LEFT','kg'],['mainR','MAIN RIGHT','kg'],
 ['auxL','AUX LEFT','kg'],['auxR','AUX RIGHT','kg'],
 ['emptyMass','EMPTY WEIGHT','kg'],['emptyMoment','EMPTY MOMENT','kg·m']
];
function card(key,label){
 const fuel=fuelRef(),v=sourceMode==='simbrief'&&fuel?.ok&&Object.prototype.hasOwnProperty.call(fuel.tanks,key)?fuel.tanks[key]:profile[key];
 return '<div class="field"><label for="val-'+key+'">'+label+'</label><div class="entry"><input data-wb="'+key+'" id="val-'+key+'" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="'+esc(inputFormat(v,0))+'" aria-label="'+label+' kg"'+(sourceMode==='simbrief'||sourceMode==='optimized'&&OPT.ADJUSTABLE.includes(key)?' readonly aria-readonly="true"':'')+'><span class="unit">kg</span></div></div>';
}
function coords(m,c){const width=270,axisL=2.33,axisR=2.51;return [31+(c-axisL)/(axisR-axisL)*width,181-(m-1500)/450*160]}
function envelope(){
 const poly=[[1510,2.357],[1900,2.418],[1900,2.480],[1700,2.480],[1510,2.460]].map(([m,c])=>coords(m,c).map(v=>v.toFixed(2)).join(',')).join(' ');
 const lines=[1510,1700,1900].map(m=>{const y=coords(m,2.33)[1].toFixed(2);return '<path d="M31 '+y+'H301" stroke="#425362" stroke-width=".8"/><text x="26" y="'+(+y+4)+'" text-anchor="end" font-size="10" fill="#9ab0bf">'+m+'</text>'}).join('');
 const columns=[2.35,2.40,2.45,2.50].map(c=>{const x=coords(1600,c)[0].toFixed(2);return '<path d="M'+x+' 21V181" stroke="#3b4b59" stroke-width=".8"/><text x="'+x+'" y="198" text-anchor="middle" font-size="10" fill="#91a8b8">'+format(c,2)+'</text>'}).join('');
 let path='',points='';
 if(model.ok){
  const plotted=[['zeroFuel','#e7b46d','ZERO FUEL'],['takeoff','#56b9ee','TAKEOFF']];
  if(sourceMode!=='simbrief'&&plotted.length>1)path='<path d="'+plotted.map(([k],i)=>{const [x,y]=coords(model[k].mass,model[k].cg);return (i?'L':'M')+x.toFixed(2)+' '+y.toFixed(2)}).join(' ')+'" fill="none" stroke="#e7b46d" stroke-dasharray="4 4" stroke-width="1.7"/>';
  points=sourceMode==='simbrief'?'':plotted.map(([k,color,title])=>{const [x,y]=coords(model[k].mass,model[k].cg);const fill=model[k].cgOK?color:'#ff9e91';return '<circle cx="'+x.toFixed(2)+'" cy="'+y.toFixed(2)+'" r="4.8" fill="'+fill+'" stroke="#202d39" stroke-width="2"><title>'+title+'</title></circle>'}).join('');
 }
 return '<svg class="graph" viewBox="0 0 320 216" role="img" aria-label="CG envelope, center of gravity versus flight mass">'+lines+columns+'<polygon points="'+poly+'" fill="#56b9ee" fill-opacity=".10" stroke="#56b9ee" stroke-width="2"/>'+path+points+'</svg>';
}
function sourceSelector(){
 return '<div class="loading-sources" role="group" aria-label="Active loading source">'+
  [['simbrief','SIMBRIEF'],['manual','MANUAL'],['optimized','OPTIMIZED']].map(([id,label])=>
   '<button type="button" class="loading-source'+(sourceMode===id?' active':'')+
   '" data-loading-source="'+id+'" aria-pressed="'+(sourceMode===id)+'"'+
   ''+'>'+label+'</button>').join('')+'</div>';
}
function ofpComparison(){
 const data=Load.loading(planRef(),sourceMode==='simbrief'?null:model,sourceMode);
 const value=x=>Number.isFinite(x)?format(x,1):'—';
 const note=sourceMode==='simbrief'?(data.fuel?.ok?'FUEL · SPLIT ASSUMED':data.limitation||'FUEL NOT AVAILABLE'):
   sourceMode==='optimized'?(data.valid?'SIMULATED · WITHIN LIMITS':'SIMULATED · CHECK LIMITS'):
   data.valid?'MANUAL · WITHIN LIMITS':'MANUAL · CHECK LIMITS';
 return '<section class="loading-summary">'+
  '<div class="loading-metrics">'+[['TOW',data.tow],['FUEL',data.fuel?.total],['CG',data.cg]].map(([label,v])=>
  '<div class="loading-metric"><span>'+label+'</span><strong>'+value(v)+'</strong></div>').join('')+'</div>'+
  '<div class="loading-note'+(data.valid&&data.fuel?.ok?' good':'')+'">'+esc(note)+'</div></section>';
}
function restoreManualLoad(){
 if(!previousManual)return;
 profile={...profile,...previousManual};optimizedMode=false;sourceMode='manual';Load.setMode(localStorage,'manual',planRef());optimizeMessage='';previousManual=null;
 try{localStorage.removeItem(AUTO_KEY);localStorage.removeItem(MANUAL_KEY)}catch{}
 render();
}
function content(){
 const active=Load.loading(planRef(),sourceMode==='simbrief'?null:model,sourceMode);
 const sc=sourceMode==='simbrief'?{massOK:active.valid}:model.ok?model.statuses:{};
 const shown=x=>Number.isFinite(x)?format(x,0):'—';
 const metrics='<div class="metrics"><div class="metric"><label>ZFW</label><b>'+shown(active.zfw)+' kg</b></div>'+
 '<div class="metric"><label>TOW</label><b>'+shown(active.tow)+' kg</b></div></div>';
 const massState=active.valid?'WEIGHT WITHIN LIMITS':sourceMode==='simbrief'?'CHECK OFP WEIGHT':model.ok?'WEIGHT LIMIT EXCEEDED':'CHECK INPUTS';
 return '<div class="phone"><header class="topbar"><span class="topbar-placeholder" aria-hidden="true"></span><h1>DA42 NG</h1><button class="icon-btn" id="settings" aria-label="Configurações da aeronave">'+icon('settings')+'</button></header>'+
 '<main class="scroller" id="scroller"><div class="module-heading"><span>WEIGHT &amp; BALANCE</span><span class="accent">CG ENVELOPE</span></div>'+sourceSelector()+
 (sourceMode==='simbrief'?'':'<div class="fields">'+card('pilot','PILOT')+card('copilot','COPILOT')+card('pax1','PASSENGER 1')+card('pax2','PASSENGER 2')+'</div>')+
 '<button class="open-load" id="edit-load" aria-label="BAGGAGE &amp; FUEL"><span class="main">BAGGAGE &amp; FUEL</span>'+icon('next')+'</button>'+
 '<div class="optimize-row'+(optimizedMode&&previousManual?' has-manual':'')+'"><button id="optimize" class="optimize-button" type="button">'+(sourceMode==='optimized'?'REOPTIMIZE':'OTIMIZAR')+'</button>'+
  (optimizedMode&&previousManual?'<button id="restore-simulated" class="restore-simulated" type="button">CARGA MANUAL</button>':'')+
  (optimizeMessage?'<span id="optimize-status" class="optimize-feedback" role="alert">'+esc(optimizeMessage)+'</span>':'')+'</div>'+
  ofpComparison()+
 '<section class="result" aria-live="polite"><div id="envelope">'+envelope()+'</div><div class="legend"><span><i class="dot" style="background:#e7b46d"></i>ZFW</span><span><i class="dot" style="background:#56b9ee"></i>TOW</span></div>'+
 '<div id="mass-check" class="standalone-status '+(sc.massOK?'':'bad')+'">'+(model.ok?massState:'—')+'</div><div id="metrics">'+metrics+'</div>'+
 '</section><div class="notice" id="notice">NOT FOR FLIGHT</div><div class="page-back"><button id="menu" type="button" aria-label="Back · MODULES">BACK</button></div></main>'+
 '<nav class="bottom" aria-label="Main navigation">'+
  '<a class="nav" href="./flight.html?tab=plan" data-nav="plan" aria-label="PLAN">'+icon('plan')+'<span>PLAN</span></a>'+
  '<a class="nav" href="./flight.html?tab=summary" data-nav="summary" aria-label="SUMMARY">'+icon('summary')+'<span>SUMMARY</span></a>'+
  '<a class="nav active" href="./flight.html?tab=modules" data-nav="modules" aria-current="page" aria-label="MODULES">'+icon('modules')+'<span>MODULES</span></a>'+
  '<button class="nav" id="nav-more" data-nav="more" type="button" aria-label="MORE" aria-expanded="false">'+icon('more')+'<span>MORE</span></button></nav></div>';
}
function normalizeNumericEntry(text){
 const raw=String(text).replace(/\s/g,'');
 if(!raw.includes(','))return raw;
 if(raw.includes('.'))return raw.lastIndexOf('.')>raw.lastIndexOf(',')?raw.replaceAll(',',''):raw.replaceAll('.','').replaceAll(',','.');
 return /^[+-]?\d{1,3}(,\d{3})+$/.test(raw)?raw.replaceAll(',',''):raw.replaceAll(',','.');
}
function parseNumber(text){
 let v=String(text).trim().replace(/\s/g,'');
 if(!v)return NaN;
 if(v.includes(',')&&v.includes('.')){
  v=v.lastIndexOf('.')>v.lastIndexOf(',')?v.replaceAll(',',''):v.replaceAll('.','').replace(',','.');
 }else if(v.includes(',')){
  v=/^[+-]?\d{1,3}(,\d{3})+$/.test(v)?v.replaceAll(',',''):v.replace(',','.');
 }else if(/^[+-]?\d{1,3}(\.\d{3})+$/.test(v)){
  v=v.replaceAll('.','');
 }
 return /^[-+]?\d+(\.\d+)?$/.test(v)?Number(v):NaN;
}
function store(){
 if(E.validate(profile).length===0){try{localStorage.setItem(KEY,JSON.stringify(profile))}catch(e){}}
}
function recalc(){
 model=resolvedModel();
 syncActive();
 const set=(s,v)=>{const e=el(s);if(e)e.innerHTML=v};
 set('#envelope',envelope());
 const summary=el('.loading-summary');if(summary)summary.outerHTML=ofpComparison();
 const active=Load.loading(planRef(),sourceMode==='simbrief'?null:model,sourceMode);
 set('#mass-check','<span class="'+(active.valid?'good':'error')+'">'+(active.valid?'WEIGHT WITHIN LIMITS':sourceMode==='simbrief'?'CHECK OFP WEIGHT':model.ok?'WEIGHT LIMIT EXCEEDED':'CHECK INPUTS')+'</span>');
 const shown=x=>Number.isFinite(x)?format(x,0):'—';
 set('#metrics','<div class="metrics"><div class="metric"><label>ZFW</label><b>'+shown(active.zfw)+' kg</b></div>'+
  '<div class="metric"><label>TOW</label><b>'+shown(active.tow)+' kg</b></div></div>');
 const notice=el('#notice');if(notice){notice.textContent=model.ok?'NOT FOR FLIGHT':model.errors.join(' · ');notice.classList.toggle('bad',!model.ok||!model.statuses.massOK||!model.statuses.cgOK)}
 const optStatus=el('#optimize-status');if(optStatus)optStatus.textContent=optimizeMessage;
 store();
}
function bindInputs(root=document){
 root.querySelectorAll('[data-wb]').forEach(inp=>{
  inp.addEventListener('input',()=>{
   const k=inp.dataset.wb;
   if(sourceMode==='simbrief'||sourceMode==='optimized'&&OPT.ADJUSTABLE.includes(k))return;
   const clean=normalizeNumericEntry(inp.value);
   if(clean!==inp.value)inp.value=clean;
   profile={...profile,[k]:parseNumber(clean)};
   recalc();
  });
 });
}
function sheet(type){
 const titles={load:'LOAD CONFIGURATION',settings:'AIRCRAFT PROFILE',scenarios:'FUEL & DE-ICE',modules:'PERFORMANCE',more:'MORE'};
 const sections={
  load:[
   ['BAGGAGE',['nose','cabin','extension']],
   ['FUEL · USEABLE WEIGHT',['mainL','mainR','auxL','auxR']],
   ['DE-ICING',['deice']]
  ],
  settings:[['EMPTY AIRCRAFT',['emptyMass','emptyMoment']]]
 };
 let body='';
 if(type==='load'||type==='settings'){
  for(const [title,keys] of sections[type]){
   body+='<div class="section-title">'+title+'</div>';
   for(const k of keys){
    const field=profilesInputs.find(([id])=>id===k);
    body+='<div class="sheet-row"><label for="sheet-'+k+'">'+field[1]+'</label><input data-wb="'+k+'" id="sheet-'+k+'" inputmode="decimal" autocomplete="off" type="text" value="'+(sourceMode==='simbrief'&&profilesInputs.find(([id])=>id===k)&&['mainL','mainR','auxL','auxR'].includes(k)?(fuelRef()?.ok?esc(inputFormat(fuelRef().tanks[k],1)):''):profile[k]===null?'':esc(inputFormat(profile[k],1)))+'" placeholder="—" aria-label="'+field[1]+'"'+(sourceMode==='simbrief'||sourceMode==='optimized'&&OPT.ADJUSTABLE.includes(k)?' readonly aria-readonly="true"':'')+'><span class="unit">'+field[2]+'</span></div>';
   }
  }
  if(type==='settings')body+=(optimizedMode&&previousManual?'<button class="action" id="restore-manual">CARGA MANUAL</button>':'')+'<button class="action" id="reset-example">AFM EXAMPLE</button>';
 }
 if(type==='scenarios'){
  const title='';
  body=title+(model.ok?model.scenarios.map(c=>'<div class="case"><div class="name">'+c.name+'</div><div class="value"><b>'+format(c.mass,1)+' kg</b><span class="'+(c.cgOK?'good':'error')+'">'+format(c.cg,3)+' m · '+(c.cgOK?'CG OK':'CG OUT')+'</span></div></div>').join(''):'<p class="error">'+model.errors.join(', ')+'</p>');
  if(model.ok)body+='<div class="section-title">LOADED CONDITION</div><div class="case"><div class="value"><span>ZFW</span><b>'+format(model.zeroFuel.mass,0)+' kg</b></div></div><div class="case"><div class="value"><span>TOW</span><b>'+format(model.takeoff.mass,0)+' kg</b></div></div>';
 }
 if(type==='modules')body='<a class="action" href="./flight.html">FLIGHT PLAN</a><a class="action" href="./index.html?calculator=1">PERFORMANCE</a><a class="action" href="./wb.html">WEIGHT &amp; BALANCE</a>';
 if(type==='more')body='<button class="action" id="nav-chart" type="button">CG ENVELOPE</button>'+
   '<button class="action" id="nav-scenarios" type="button">FUEL &amp; DE-ICE</button>'+
   '<button class="action" id="nav-settings" type="button">AIRCRAFT PROFILE</button>'+
   '<a class="action" href="./flight.html?tab=more">PREFERENCES</a>';
 const d=document.createElement('div');d.className='sheet-backdrop';d.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="'+titles[type]+'"><div class="sheet-head"><h2>'+titles[type]+'</h2></div>'+body+'<button class="close sheet-return" type="button" aria-label="Back · MODULES">BACK</button></div>';
 el('.phone').appendChild(d);
 d.addEventListener('click',ev=>{if(ev.target===d)d.remove()});
 d.querySelector('.close').onclick=backToModules;
 if(type==='more'){
  const footer=el('#nav-more'),modules=el('[data-nav="modules"]');
  if(footer){footer.classList.add('active');footer.setAttribute('aria-expanded','true')}
  if(modules){modules.classList.remove('active');modules.removeAttribute('aria-current')}
  const restoreFooter=()=>{
   if(footer){footer.classList.remove('active');footer.setAttribute('aria-expanded','false')}
   if(modules){modules.classList.add('active');modules.setAttribute('aria-current','page')}
  };
  const observer=new MutationObserver(()=>{if(!d.isConnected){restoreFooter();observer.disconnect()}});
  observer.observe(el('.phone'),{childList:true});
  d.querySelector('#nav-chart').onclick=()=>{d.remove();el('.result')?.scrollIntoView({behavior:'smooth',block:'start'})};
  d.querySelector('#nav-scenarios').onclick=()=>{d.remove();sheet('scenarios')};
  d.querySelector('#nav-settings').onclick=()=>{d.remove();sheet('settings')};
 }
 bindInputs(d);
 const restore=d.querySelector('#restore-manual');if(restore)restore.onclick=()=>{d.remove();restoreManualLoad()};
 const reset=d.querySelector('#reset-example');if(reset)reset.onclick=()=>{profile={...E.EXAMPLE};optimizedMode=false;sourceMode='manual';Load.setMode(localStorage,'manual',planRef());previousManual=null;optimizeMessage='';model=E.calculate(profile);try{localStorage.removeItem(KEY);localStorage.removeItem(AUTO_KEY);localStorage.removeItem(MANUAL_KEY)}catch(e){}d.remove();render()};
}
function backToModules(){store();location.assign('./flight.html?tab=modules')}
function render(){
 model=resolvedModel();el('#app').innerHTML=content();bindInputs();
 document.querySelectorAll('[data-loading-source]').forEach(b=>b.onclick=()=>selectSource(b.dataset.loadingSource));
 el('#menu').onclick=backToModules;
 el('#settings').onclick=()=>sheet('settings');
 el('#edit-load').onclick=()=>sheet('load');
  const manual=el('#restore-simulated');if(manual)manual.onclick=restoreManualLoad;
 el('#optimize').onclick=runOptimize;
  el('#nav-more').onclick=()=>sheet('more');
 recalc();
}
window.WBApp={get profile(){return profile},get model(){return model},get optimizedMode(){return optimizedMode},get mode(){return sourceMode},render,sheet,optimize:()=>OPT.optimize(profile,E)};
render();
if('serviceWorker'in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
