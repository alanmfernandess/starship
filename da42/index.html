.primary{display:flex;align-items:baseline;gap:10px;margin-top:15px;white-space:nowrap}.primary-number{font-size:45px;line-height:1.09;letter-spacing:-1.6px;font-weight:550;font-variant-numeric:tabular-nums}.primary-unit{font-size:16px;color:#afc2ce}.primary-number.negative{color:var(--amber)}
.plot{height:clamp(138px,18dvh,215px);width:100%;display:block;margin:8px 0 6px;overflow:visible}.plot .grid{stroke:#354b5a;stroke-width:.8}.plot .blue{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.plot .gold{fill:none;stroke:var(--amber);stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}.plot .dot{fill:var(--blue);stroke:var(--tile);stroke-width:2}

.bottom{height:65px;flex:0 0 auto;display:flex;justify-content:space-around;align-items:center;padding:3px 24px 10px;background:var(--bg)}.nav-btn{color:#839bae;background:none;border:0;width:46px;height:47px;display:grid;place-items:center;border-radius:10px}.nav-btn.active{color:var(--blue)}.nav-btn .icon{width:23px;height:23px}
.sheet-backdrop{position:absolute;inset:0;background:#050b12ab;z-index:4;display:flex;align-items:flex-end}.sheet{width:100%;max-height:79%;overflow:auto;background:#17232e;border-radius:24px 24px 0 0;padding:20px 20px max(24px,env(safe-area-inset-bottom));box-shadow:0 -8px 40px #0003}.sheet-header{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:16px}.sheet h2{font-size:18px;margin:0;font-weight:500}.sheet button.close{border:0;background:none;color:#9cb4c3;font-size:24px;padding:0 7px}.sheet .option{width:100%;min-height:62px;border:none;background:#202d39;color:#ecf5fa;text-align:left;border-radius:14px;padding:12px 15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px}.sheet .option .sub{display:block;color:#90a7b7;font-size:11px;margin-top:4px}.sheet .option.selected{box-shadow:inset 0 0 0 1px var(--blue)}.sheet .option svg{width:18px;height:18px;color:var(--blue)}.sheet small{color:#a7bdc8;line-height:1.5;font-size:12px;display:block;margin-top:12px}.sheet .mini{font-size:12px;color:#91a9b9}.sheet .disclaimer{margin-top:16px;color:#e2b176;font-size:12px;line-height:1.5}.sheet .history-empty{color:#90a7b7;font-size:12px;margin:20px 0}.sheet .small-action{background:transparent;border:1px solid #415567;border-radius:10px;color:#aec2d0;padding:11px 14px;width:100%;margin-top:10px}
@media(max-width:355px){.topbar{height:78px;margin:0 17px}.scroller{padding:0 17px 12px}.module-heading{margin-top:22px;margin-bottom:13px}.field{height:87px;padding:13px 12px 9px}.field input{font-size:27px}.result{min-height:265px}.plot{height:125px}}
@media(max-height:730px){.topbar{height:72px;padding-top:17px}.module-heading{margin-top:15px;margin-bottom:12px}.field{height:87px}.fields{margin-bottom:10px}.result{padding-top:14px;min-height:265px}.plot{height:124px}.bottom{height:57px}}
@media(prefers-reduced-motion:no-preference){.sheet{animation:rise .2s ease-out}@keyframes rise{from{transform:translateY(15px);opacity:.85}to{transform:translateY(0);opacity:1}}}

<body><div id="app"></div>
<script>
'use strict';
/**
 * Aero UI 1.0 — Prototype / engineering demonstration only.
 * Raster-digitized, piecewise-interpolated graphical nomogram curves; calibration anchored to published examples.
 * NOT independently validated at off-example conditions. Not approved for flight.
 */
const MODELS={
 takeoff:{label:'TAKEOFF',panel:'TAKEOFF DISTANCE',metric:'GROUND ROLL',unit:'m',metricUnit:'m',fields:[{k:'pa',name:'PRESSURE ALT',u:'ft'},{k:'oat',name:'OAT',u:'°C'},{k:'mass',name:'T/O MASS',u:'kg'},{k:'wind',name:'HEADWIND',u:'kt'}],defaults:{pa:0,oat:15,mass:1800,wind:10}},
 climb:{label:'CLIMB',panel:'RATE OF CLIMB',metric:'VERTICAL SPEED',unit:'ft/min',metricUnit:'m/s',fields:[{k:'pa',name:'PRESSURE ALT',u:'ft'},{k:'oat',name:'OAT',u:'°C'},{k:'mass',name:'FLIGHT MASS',u:'kg'},{k:'power',name:'POWER',u:'%',fixed:true}],defaults:{pa:0,oat:15,mass:1800,power:92}},
 oei:{label:'ONE ENGINE CLIMB / DESCENT',panel:'RATE OF CLIMB',metric:'VERTICAL SPEED',unit:'ft/min',metricUnit:'m/s',fields:[{k:'pa',name:'PRESSURE ALT',u:'ft'},{k:'oat',name:'OAT',u:'°C'},{k:'mass',name:'FLIGHT MASS',u:'kg'},{k:'power',name:'ENGINE POWER',u:'%',fixed:true}],defaults:{pa:0,oat:15,mass:1800,power:92}},
 cruise:{label:'CRUISING',panel:'TRUE AIRSPEED',metric:'ISA DEVIATION',unit:'KTAS',metricUnit:'°C',fields:[{k:'pa',name:'PRESSURE ALT',u:'ft'},{k:'oat',name:'OAT',u:'°C'},{k:'load',name:'ENGINE LOAD',u:'%'},{k:'engines',name:'ENGINES',u:'',fixed:true,fixedValue:2}],defaults:{pa:10000,oat:-5,load:80,engines:2}},
 landing:{label:'LANDING',panel:'LANDING DISTANCE',metric:'GROUND ROLL',unit:'m',metricUnit:'m',fields:[{k:'pa',name:'PRESSURE ALT',u:'ft'},{k:'oat',name:'OAT',u:'°C'},{k:'mass',name:'LDG MASS',u:'kg'},{k:'wind',name:'HEADWIND',u:'kt'}],defaults:{pa:0,oat:15,mass:1800,wind:10}},
 abnormal:{label:'ABNORMAL LANDING',panel:'LANDING DISTANCE',metric:'GROUND ROLL',unit:'m',metricUnit:'m',fields:[{k:'pa',name:'PRESSURE ALT',u:'ft'},{k:'oat',name:'OAT',u:'°C'},{k:'mass',name:'LDG MASS',u:'kg'},{k:'wind',name:'HEADWIND',u:'kt'}],defaults:{pa:0,oat:15,mass:1800,wind:10}},
 goaround:{label:'GO-AROUND',panel:'CLIMB GRADIENT',metric:'RATE OF CLIMB',unit:'%',metricUnit:'ft/min',fields:[{k:'mass',name:'LANDING MASS',u:'kg',fixed:true,choice:true},{k:'pa',name:'PRESSURE ALT',u:'ft',fixed:true,fixedValue:0},{k:'isa',name:'ISA DEVIATION',u:'°C',fixed:true,fixedValue:0},{k:'speed',name:'AIRSPEED',u:'KIAS',fixed:true,fixedValue:84}],defaults:{mass:1805,pa:0,isa:0,speed:84}}
};
const el=s=>document.querySelector(s),escapeHTML=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const persisted=(()=>{try{return JSON.parse(localStorage.getItem('aero-ui-da42-v1'))||{}}catch{return {}}})();
let current=Object.prototype.hasOwnProperty.call(MODELS,persisted.current)?persisted.current:'takeoff';let inputs={};for(const id in MODELS)inputs[id]={...MODELS[id].defaults,...(persisted.inputs&&persisted.inputs[id]||{})};let history=Array.isArray(persisted.history)?persisted.history.slice(0,20):[];
let cruiseTempMode=persisted.cruiseTempMode==='isa'?'isa':'oat';
function persist(){try{localStorage.setItem('aero-ui-da42-v1',JSON.stringify({current,inputs,history,cruiseTempMode}))}catch{}}
/**
 * Reverse-engineered graphical nomograms, 7.01.15-E Rev.1 (2009):
 * - Left-panel curves: 3 manually digitized ordinate anchors per altitude.
 * - Other panels: Hough line-segment fits from the rasterized AFM charts.
 * - Piecewise interpolation only (no atmospheric/performance proxy formula).
 * - One published example per module sets the ordinate registration.
 * Important: graphical readings have NOT been independently verified at
 * off-example conditions. Not suitable for aircraft operations.
 */
const NOMOGRAMS={
 takeoff:{pa:[0,2000,4000,6000,8000,10000],start:[627,608,585,560,540,512],mid:[582,559,531,497,449,395],end:[522,495,463,412,354,302],
  mass:[[304.6,.691],[351.8,.610],[390.4,.542],[437.6,.473],[479.7,.397],[527.7,.321],[563.8,.265],[591.8,.224],[620.7,.177]],
  headwind:[[304,.502],[351,.459],[390,.427],[438,.362],[479,.326],[528,.280],[564,.240],[610,.190],[646,.149]],
  tailwind:[[303,-1.65],[351,-1.52],[389,-1.38],[436,-1.22],[477,-1.10],[525,-.96],[562,-.84],[608,-.65],[646,-.49]],
  height:[[273,-8.30],[381,-6.47],[426,-5.20],[473,-4.20],[523,-3.13],[568,-2.42],[611,-1.91],[623,-1.60],[667,-1.00]]},
 climb:{pa:[0,2000,4000,6000,8000,10000,12000,14000,16000,18000],
  start:[545,537,527,515,498,480,460,435,381,328],mid:[518,501,486,469,452,429,378,326,260,202],end:[462,441,422,402,382,362,330,294,254,202],
  mass:[[196,.295],[231,.306],[263,.339],[310,.361],[357,.380],[405,.426],[446,.444],[494,.460],[516,.440],[538,.436]]},
 oei:{pa:[0,2000,4000,6000,8000,10000,12000,14000,16000,18000],
  start:[563,553,539,522,504,486,469,424,370,320],mid:[530,511,489,465,441,415,366,315,257,210],end:[476,459,440,419,398,378,352,315,258,210],
  mass:[[198.5,.198],[229.6,.218],[262.2,.234],[299.5,.261],[336.7,.283],[390.4,.306],[438,.325],[499.6,.333],[562.7,.356],[635,.370]]}
 ,landing:{pa:[0,2000,4000,6000,8000,10000],
 start:[706,687,664,640,606,565],
 mid:[661,642,621,598,566,527],
 end:[612,591,563,535,489,427]},
 // Abnormal UP/APP chart: separately sampled left-panel pressure-altitude curves.
 abnormal:{pa:[0,2000,4000,6000,8000,10000],
 start:[705,694,677,661,636,601],
 mid:[648,636,618,600,577,541],
 end:[589,559,531,498,465,428]}
};
function lerp(a,b,q){return a+(b-a)*q}
function interp(rows,x){if(x<rows[0][0]||x>rows[rows.length-1][0])throw Error('FORA DO DOMÍNIO DIGITALIZADO');for(let i=1;i<rows.length;i++)if(x<=rows[i][0]){const a=rows[i-1],b=rows[i],q=(x-a[0])/(b[0]-a[0]);return lerp(a[1],b[1],q)}return rows.at(-1)[1]}
function isaMax(pa){return 50-.0019812*pa}
function isaTemperature(pa){return 15-.0019812*pa}
function cruiseDeviation(v){return v.oat-isaTemperature(v.pa)}
function leftPanel(id,pa,oat){const n=NOMOGRAMS[id];const deltaISA=oat-(15-.0019812*pa);const rows=[];
 for(let i=0;i<n.pa.length;i++){
  const altitude=n.pa[i],max=isaMax(altitude),mid=Math.min(15,max);
  const temperature=deltaISA+15-.0019812*altitude;
  const anchors=[[-35,n.start[i]],[mid,n.mid[i]]];
  if(max>mid+1e-4)anchors.push([max,n.end[i]]);
  const j=temperature< -35?-35:temperature>max?max:temperature;
  rows.push([altitude,interp(anchors,j)]);
 }
 return interp(rows,pa)
}
function stage(rows,yIn,dx){return yIn+interp(rows,yIn)*dx}
function takeoffDistance(y){return 100+(708-y)*1500/527}
function rawCompute(id,v){const n=NOMOGRAMS[id];let y=leftPanel(id,v.pa,v.oat);
 if(id==='takeoff'){
  y=stage(n.mass,y,((1900-v.mass)/400)*153);
  const w=v.wind>=0?n.headwind:n.tailwind;
  y=stage(w,y,Math.abs(v.wind)*(v.wind>=0?154/20:78/10));
  return {ground:takeoffDistance(y),total:takeoffDistance(stage(n.height,y,45))};
 }
 y=stage(n.mass,y,((1900-v.mass)/400)*358);
 return {roc:id==='climb'?300+(y-179)*1200/528:-300+(y-167)*700/533};
}

/**
 * TAS chart raster digitization: 1752x1212 px, x=158 px at 120 kt,
 * x=1670 px at 180 kt. Coordinates read from ISA STD solid curves
 * at 50/60/70/80/92% load, 0-18000 ft. Adjacent ISA curves
 * -10/+10/+20/+30 deg C approximated by measured pixel spacing.
 * Experimental engineering estimate; not flight-validated.
 */
const CRUISE_CHART={
 alt:[0,2000,5000,8000,10000,12000,14000,16000,18000],
 pxStd:{
  50:[369,402,452,516,553,594,638,680,722],
  60:[617,656,713,781,823,871,920,970,1019],
  70:[866,898,947,1010,1053,1107,1174,1212,1267],
  80:[1031,1072,1138,1225,1262,1310,1384,1430,1489],
  92:[1256,1280,1340,1427,1480,1512,1540,1519,1494]
 },
 pxPer10C:[21,22,24,26,28,29,31,33,34],
 xAt120:158,xAt180:1670
};
function cruiseLimits(v){
 if(!Number.isFinite(v.pa)||!Number.isFinite(v.oat)||!Number.isFinite(v.load))return 'COMPLETE OS VALORES';
 if(v.engines!==2)return 'CARTA APLICÁVEL A DOIS MOTORES';
 if(v.pa<0||v.pa>18000)return 'ALTITUDE FORA DA REGIÃO DIGITALIZADA';
 if(v.load<50||v.load>92)return 'CARGA FORA DO GRÁFICO';
 const d=v.oat-(15-.0019812*v.pa);
 if(d < -10-1e-6 || d >30+1e-6)return 'TEMPERATURA FORA DAS CURVAS ISA';
 return null;
}
function cruiseCompute(v){
 const error=cruiseLimits(v);if(error)return {error};
 const solid=interp(Object.entries(CRUISE_CHART.pxStd).map(([load,x])=>
  [Number(load),interp(CRUISE_CHART.alt.map((a,i)=>[a,x[i]]),v.pa)]),v.load);
 const delta=v.oat-(15-.0019812*v.pa);
 const spacing=interp(CRUISE_CHART.alt.map((a,i)=>[a,CRUISE_CHART.pxPer10C[i]]),v.pa);
 const pixel=solid+delta/10*spacing;
 const tas=120+(pixel-CRUISE_CHART.xAt120)*60/(CRUISE_CHART.xAt180-CRUISE_CHART.xAt120);
 // The source chart is bounded by its TAS axis; do not extrapolate the raster result.
 if(!Number.isFinite(tas)||tas<120||tas>180)return {error:'TAS FORA DO DOMÍNIO DA CARTA'};
 return {main:tas,secondary:delta,primaryLabel:'TRUE AIRSPEED'};
}
// Cyan=current ISA deviation; amber=ISA+30 deg C. Both calculated from the chart.
function cruisePlot(v,r){
 if(r.error)return '<svg class="plot" viewBox="0 0 290 138" aria-label="Gráfico indisponível" role="img"></svg>';
 const alt=CRUISE_CHART.alt,d=v.oat-(15-.0019812*v.pa);
 const series=alt.map((pa,i)=>{const isa=15-.0019812*pa;
  return {x:6+i*278/(alt.length-1),blue:cruiseCompute({pa,oat:isa+d,load:v.load,engines:2}).main,
   gold:cruiseCompute({pa,oat:isa+30,load:v.load,engines:2}).main};});
 const vals=series.flatMap(a=>[a.blue,a.gold]),lo=Math.min(...vals)-.5,hi=Math.max(...vals)+.5;
 const y=v=>119-98*(v-lo)/(hi-lo);
 function curve(k){let out='M '+series[0].x.toFixed(1)+' '+y(series[0][k]).toFixed(1);
  for(let i=0;i<series.length-1;i++){const a=series[i],b=series[i+1],dx=b.x-a.x,p=series[Math.max(0,i-1)],q=series[Math.min(series.length-1,i+2)];
   let u=(y(b[k])-y(p[k]))/(b.x-p.x||1),w=(y(q[k])-y(a[k]))/(q.x-a.x||1);
   const m=(y(b[k])-y(a[k]))/dx;
   if(m===0){u=0;w=0;}else{u=Math.sign(m)*Math.min(Math.abs(u),2*Math.abs(m));w=Math.sign(m)*Math.min(Math.abs(w),2*Math.abs(m));}
   out+=' C '+(a.x+dx/3).toFixed(1)+' '+(y(a[k])+dx*u/3).toFixed(1)+', '+(b.x-dx/3).toFixed(1)+' '+(y(b[k])-dx*w/3).toFixed(1)+', '+b.x.toFixed(1)+' '+y(b[k]).toFixed(1);}
  return out;}
 return '<svg class="plot" viewBox="0 0 290 138" preserveAspectRatio="none" role="img" aria-label="TAS por altitude; azul: temperatura selecionada; âmbar: ISA mais trinta graus"><path class="grid" d="M0 28H290M0 75H290M0 121H290"/><path class="gold" d="'+curve('gold')+'"/><path class="blue" d="'+curve('blue')+'"/><circle class="dot" cx="'+(6+v.pa/18000*278).toFixed(1)+'" cy="'+y(r.main).toFixed(1)+'" r="4.5"/></svg>';
}


/* Landing distance graphical-stage approximations, not flight-validated.
 * Pressure altitude curves and mass/wind/height corrections read from
 * supplied DA42 NG LDG flaps nomogram raster; reference example anchors.
 */
const LANDING_CHART={

function showSheet(type){const main=el('.phone'),title={modules:'PERFORMANCE',settings:'PREFERÊNCIAS',chart:'SENSIBILIDADE',history:'HISTÓRICO'}[type]||'';const v=inputs[current];const r=compute(current,v);let content='';
 if(type==='modules')content=Object.entries(MODELS).map(([k,m],i)=>`<button class="option ${current===k?'selected':''}" data-module="${k}"><span><strong>0${i+1} · ${k==='oei'?'ONE ENGINE CLIMB / DESCENT':k==='cruise'?'CRUISING · TRUE AIRSPEED':k==='landing'?'LANDING · FLAPS LDG':k==='abnormal'?'ABNORMAL LANDING · UP / APP':k==='goaround'?'GO-AROUND · CLIMB GRADIENT':m.label+' PERFORMANCE'}</strong><span class="sub">${k==='takeoff'?'Takeoff distance / ground roll':k==='climb'?'Two engines · 92%':k==='cruise'?'50–92% engine load · 2 engines':k==='landing'?'Ground roll / 50 ft obstacle':k==='abnormal'?'Flaps UP or APP · 86 KIAS':k==='goaround'?'ISA / MSL · 1805 / 1900 kg':'One engine inoperative · 92%'}</span></span>${current===k?icon('check'):icon('next')}</button>`).join('');
 if(type==='settings')content=`<div class="mini">AERO UI · MASTER DESIGN 1.0</div><small>Parâmetros: gráficos do DA42 NG enviados pelo usuário. Condições: flaps UP; pista pavimentada na decolagem; ambos MAX/2.300 RPM no Takeoff, ambos 92%/90 KIAS no Climb, e motor restante a 92%/85 KIAS no OEI, com motor inoperante embandeirado e assegurado. Cruzeiro: 2 motores, carga 50–92% e ISA −10/+30 °C, até 18.000 ft. Pouso: flaps LDG, ambos IDLE, pista nivelada, dura e seca, 84 KIAS. Pouso anormal: flaps UP/APP, ambos IDLE, 86 KIAS. Arremetida: somente ISA/MSL, flaps LDG, trem estendido, ambos MAX, 84 KIAS, massas 1805/1900 kg.</small><div class="disclaimer">MODELO DE ENGENHARIA PRELIMINAR<br>Curvas parcialmente digitalizadas e interpoladas da carta AFM 7.01.15-E Rev.1. Somente os exemplos impressos foram conferidos; demais pontos ainda exigem validação independente. Não utilizar para planejamento, despacho ou execução de voo.</div><button class="small-action" id="reset">RESTAURAR VALORES DE EXEMPLO</button>`;
 if(type==='history')content=history.length?history.map(h=>`<button class="option" data-restore="${h.id}"><span><strong>${escapeHTML(h.name)} · ${escapeHTML(h.result)}</strong><span class="sub">${escapeHTML(h.when)} · ${escapeHTML(h.in)}</span></span>${icon('next')}</button>`).join(''):'<p class="history-empty">Nenhum cálculo salvo.</p>';
 if(type==='chart')content=`<div style="background:#202d39;border-radius:17px;padding:15px"><div class="mini">${escapeHTML(MODELS[current].panel)}</div><div style="font-size:31px;margin:12px 0 6px">${r.error?'—':fmt(r.main,current==='goaround'?1:0)} <span style="color:#9cb1bf;font-size:16px">${MODELS[current].unit}</span></div>${createPlot(current,v,r)}</div><small>Curvas derivadas da digitalização gráfica preliminar. Sem autorização para uso operacional.</small><button class="small-action" id="save">SALVAR CÁLCULO NO HISTÓRICO</button>`;
 const d=document.createElement('div');d.className='sheet-backdrop';d.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="sheet-header"><h2>${title}</h2><button class="close" aria-label="Fechar">×</button></div>${content}</div>`;main.appendChild(d);d.addEventListener('click',e=>{if(e.target===d)d.remove()});d.querySelector('.close').onclick=()=>d.remove();d.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>{current=b.dataset.module;d.remove();render()});if(d.querySelector('#reset'))d.querySelector('#reset').onclick=()=>{inputs[current]={...MODELS[current].defaults};d.remove();render()};if(d.querySelector('#save'))d.querySelector('#save').onclick=()=>{const val=compute(current,v);if(val.error)return;history.unshift({id:Date.now(),name:MODELS[current].label,result:`${fmt(val.main,current==='goaround'?1:0)} ${MODELS[current].unit}`,when:new Date().toLocaleString('pt-BR'),in:current==='goaround'?`${fmt(v.mass)} kg · ISA / MSL · 84 KIAS`:`${fmt(v.pa)} ft · ${fmt(v.oat)} °C · ${current==='cruise'?fmt(v.load)+'%':fmt(v.mass)+' kg'}`,module:current,values:{...v}});history=history.slice(0,20);persist();d.remove()};d.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{const h=history.find(z=>String(z.id)===b.dataset.restore);if(!h)return;current=h.module;inputs[current]={...h.values};d.remove();render()});}
window.AeroCalc={MODELS,NOMOGRAMS,CRUISE_CHART,LANDING_CHART,ABNORMAL_CHART,GO_AROUND_PUBLISHED,GRAPH_REGISTRATION,limits,compute,showSheet,get current(){return current},get cruiseTempMode(){return cruiseTempMode},get inputs(){return inputs},isaTemperature,cruiseDeviation};
render();if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
