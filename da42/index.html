};
const el=s=>document.querySelector(s),escapeHTML=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let current=Object.prototype.hasOwnProperty.call(MODELS,persisted.current)?persisted.current:'takeoff';let inputs={};for(const id in MODELS)inputs[id]={...MODELS[id].defaults,...(persisted.inputs&&persisted.inputs[id]||{})};if(persisted.inputs&&persisted.inputs.goaround&&!Object.prototype.hasOwnProperty.call(persisted.inputs.goaround,'oat')){inputs.goaround.isa=true;delete inputs.goaround.speed;}let history=Array.isArray(persisted.history)?persisted.history.slice(0,20):[];

/**
 * Reverse-engineered graphical nomograms, 7.01.15-E Rev.1 (2009):
 * - Left-panel curves: 3 manually digitized ordinate anchors per altitude.

 * - Piecewise interpolation only (no atmospheric/performance proxy formula).

 * Important: graphical readings have NOT been independently verified at
 * off-example conditions. Not suitable for aircraft operations.
 */
const NOMOGRAMS={
 takeoff:{pa:[0,2000,4000,6000,8000,10000],start:[627,608,585,560,540,512],mid:[582,559,531,497,449,395],end:[522,495,463,412,354,302],

 ,landing:{pa:[0,2000,4000,6000,8000,10000],
 start:[706,687,664,640,606,565],
 mid:[661,642,621,598,566,527],
 end:[612,591,563,535,489,427]},
 // Abnormal UP/APP chart: separately sampled left-panel pressure-altitude curves.

function lerp(a,b,q){return a+(b-a)*q}
function interp(rows,x){if(x<rows[0][0]||x>rows[rows.length-1][0])throw Error('FORA DO DOMÍNIO DIGITALIZADO');for(let i=1;i<rows.length;i++)if(x<=rows[i][0]){const a=rows[i-1],b=rows[i],q=(x-a[0])/(b[0]-a[0]);return lerp(a[1],b[1],q)}return rows.at(-1)[1]}
function isaMax(pa){return 50-.0019812*pa}
function isaTemperature(pa){return 15-.0019812*pa}
function cruiseDeviation(v){return v.oat-isaTemperature(v.pa)}
function leftPanel(id,pa,oat){const n=NOMOGRAMS[id];const deltaISA=oat-(15-.0019812*pa);const rows=[];
 for(let i=0;i<n.pa.length;i++){
  const altitude=n.pa[i],max=isaMax(altitude),mid=Math.min(15,max);
  const temperature=deltaISA+15-.0019812*altitude;
  const anchors=[[-35,n.start[i]],[mid,n.mid[i]]];

  const j=temperature< -35?-35:temperature>max?max:temperature;
  rows.push([altitude,interp(anchors,j)]);

}
function stage(rows,yIn,dx){return yIn+interp(rows,yIn)*dx}
function takeoffDistance(y){return 100+(708-y)*1500/527}
function rawCompute(id,v){const n=NOMOGRAMS[id];let y=leftPanel(id,v.pa,v.oat);
 if(id==='takeoff'){
  y=stage(n.mass,y,((1900-v.mass)/400)*153);
  const w=v.wind>=0?n.headwind:n.tailwind;
  y=stage(w,y,Math.abs(v.wind)*(v.wind>=0?154/20:78/10));
  return {ground:takeoffDistance(y),total:takeoffDistance(stage(n.height,y,45))};
 }
 y=stage(n.mass,y,((1900-v.mass)/400)*358);
 return {roc:id==='climb'?300+(y-179)*1200/528:-300+(y-167)*700/533};
}

/**

 * -10/+10/+20/+30 deg C approximated by measured pixel spacing.
 * Experimental engineering estimate; not flight-validated.
 */
const CRUISE_CHART={
 alt:[0,2000,5000,8000,10000,12000,14000,16000,18000],
 pxStd:{
  50:[369,402,452,516,553,594,638,680,722],
  60:[617,656,713,781,823,871,920,970,1019],
  70:[866,898,947,1010,1053,1107,1174,1212,1267],
  80:[1031,1072,1138,1225,1262,1310,1384,1430,1489],
  92:[1256,1280,1340,1427,1480,1512,1540,1519,1494]

 pxPer10C:[21,22,24,26,28,29,31,33,34],

};
function cruiseLimits(v){
 if(!Number.isFinite(v.pa)||!Number.isFinite(v.oat)||!Number.isFinite(v.load))return 'COMPLETE OS VALORES';
 if(v.engines!==2)return 'CARTA APLICÁVEL A DOIS MOTORES';
 if(v.pa<0||v.pa>18000)return 'ALTITUDE FORA DA REGIÃO DIGITALIZADA';

 const d=v.oat-(15-.0019812*v.pa);

}
function cruiseCompute(v){

 if(type==='history')content=history.length?history.map(h=>`<button class="option" data-restore="${h.id}"><span><strong>${escapeHTML(h.name)} · ${escapeHTML(h.result)}</strong><span class="sub">${escapeHTML(h.when)} · ${escapeHTML(h.in)}</span></span>${icon('next')}</button>`).join(''):'<p class="history-empty">Nenhum cálculo salvo.</p>';
 if(type==='chart')content=`<div style="background:#202d39;border-radius:17px;padding:15px"><div class="mini">${escapeHTML(MODELS[current].panel)}</div><div style="font-size:31px;margin:12px 0 6px">${r.error?'—':fmt(r.main,current==='timeclimb'?1:0)} <span style="color:#9cb1bf;font-size:16px">${MODELS[current].unit}</span></div>${createPlot(current,v,r)}</div><small>${current==='goaround'?'AFM §5.3.12 · ROC TABULADA · NOT FOR FLIGHT':current==='timeclimb'?'AFM §5.3.9 · ISA · ZERO WIND · NOT FOR FLIGHT':current==='cruiseperf'?'AFM §5.3.10 · 1999 KG · NOT FOR FLIGHT':'Curvas derivadas da digitalização gráfica preliminar. Sem autorização para uso operacional.'}</small><button class="small-action" id="save">SALVAR CÁLCULO NO HISTÓRICO</button>`;
 const d=document.createElement('div');d.className='sheet-backdrop';d.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="sheet-header"><h2>${title}</h2><button class="close" aria-label="Fechar">×</button></div>${content}</div>`;main.appendChild(d);d.addEventListener('click',e=>{if(e.target===d)d.remove()});d.querySelector('.close').onclick=()=>d.remove();d.querySelectorAll('[data-surface]').forEach(b=>b.onclick=()=>{v.surface=b.dataset.surface;if(v.surface==='paved'){v.soft=false;if(current==='takeoff')v.wet=false}d.remove();render()});
 const wetButton=d.querySelector('#runway-wet');if(wetButton)wetButton.onclick=()=>{v.wet=!v.wet;if(v.wet&&v.surface==='paved'&&current==='takeoff')v.surface='grass5';d.remove();render()};
 const softButton=d.querySelector('#runway-soft');if(softButton)softButton.onclick=()=>{v.soft=!v.soft;if(v.soft&&v.surface==='paved')v.surface='grass5';d.remove();render()};
 const slopeInput=d.querySelector('#runway-slope');if(slopeInput)slopeInput.oninput=()=>{
  v.slope=Number(slopeInput.value);
  const value=d.querySelector('#slope-value');if(value)value.textContent=String(v.slope).replace('.',',')+'%';
  slopeInput.style.setProperty('--fill',(v.slope/5*100)+'%');
  refresh();persist();
 };
 d.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>{current=b.dataset.module;d.remove();render()});if(d.querySelector('#reset'))d.querySelector('#reset').onclick=()=>{inputs[current]={...MODELS[current].defaults};d.remove();render()};if(d.querySelector('#save'))d.querySelector('#save').onclick=()=>{const val=compute(current,v);if(val.error)return;history.unshift({id:Date.now(),name:MODELS[current].label,result:`${fmt(val.main,current==='timeclimb'?1:0)} ${MODELS[current].unit}`,when:new Date().toLocaleString('pt-BR'),in:current==='goaround'?`${fmt(v.mass)} kg · ISA / MSL · 84 KIAS`:current==='timeclimb'?`${fmt(v.start)} → ${fmt(v.target)} ft · ${fmt(v.oat)} °C · ${fmt(v.mass)} kg`:`${fmt(v.pa)} ft · ${fmt(v.oat)} °C · ${(current==='cruise'||current==='cruiseperf')?fmt(v.load)+'%':fmt(v.mass)+' kg'}`,module:current,values:{...v}});history=history.slice(0,20);persist();d.remove()};d.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{const h=history.find(z=>String(z.id)===b.dataset.restore);if(!h)return;current=h.module;inputs[current]={...h.values};d.remove();render()});}
