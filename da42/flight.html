<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101820">
<meta name="description" content="Aero UI DA42 NG — Flight Plan, SimBrief import and experimental performance. Not for flight.">
<title>DA42 NG · Flight Plan</title>
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--bg:#101820;--tile:#202d39;--line:#344652;--blue:#56b9ee;--amber:#e7b46d;--txt:#f1f5f9;--sub:#9fb3c1;--green:#79cf9d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#101820;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#app{display:flex;justify-content:center;align-items:center;min-height:100dvh;background:#fdfdfd}
.phone{width:100%;max-width:480px;height:100dvh;min-height:550px;max-height:950px;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);position:relative}
@media(min-width:550px){#app{padding:18px}.phone{width:min(420px,calc(100dvh*.59));height:min(860px,calc(100dvh - 36px));min-height:550px;border-radius:35px;box-shadow:0 14px 65px #0c121b32}}
.topbar{height:clamp(67px,9.8dvh,102px);flex:none;margin:0 15px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:80px minmax(0,1fr) 80px;align-items:start;padding-top:clamp(24px,3dvh,38px)}
.topbar h1{text-align:center;font-weight:500;font-size:23px;letter-spacing:-.5px;line-height:30px;margin:0}
.topbar button{border:0;background:transparent;color:#9eb2c0;width:38px;height:36px;padding:5px}
.topbar button:last-child{justify-self:end}
.topbar .header-back{display:flex;align-items:center;gap:5px;width:auto;min-height:36px;padding:4px 0;color:#a9c2d2;font-size:11px;font-weight:650;letter-spacing:.35px}
.topbar .header-back .icon{width:18px;height:18px;flex:none}
.icon{width:23px;height:23px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.content{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:clamp(17px,3dvh,28px) 14px 22px;scrollbar-width:none}
.heading{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#b2c4d0;letter-spacing:.3px;font-size:11px;margin-bottom:18px}
.heading .accent{color:var(--blue)}
.tile{background:var(--tile);border-radius:16px;padding:16px;margin-bottom:11px}
.eyebrow{color:#9cb4c4;font-size:10px;font-weight:600;letter-spacing:.45px}
.title{font-size:17px;font-weight:600;letter-spacing:-.15px}
.sub{font-size:11px;color:var(--sub);line-height:1.5}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand strong{font-size:20px;letter-spacing:-.3px}
.pill{font-size:9px;letter-spacing:.3px;color:#9dd6f5;background:#193749;border:1px solid #386480;border-radius:8px;padding:6px 8px}
label{display:block;font-size:11px;font-weight:600;color:#aabfce;letter-spacing:.15px;margin:0 0 7px}
.text-input{width:100%;background:#13232e;color:#f1f5f9;border:1px solid #45697f;padding:12px;border-radius:11px;min-height:46px;font-size:16px;min-width:0}
.text-input:focus{border-color:var(--blue)}
.text-input::placeholder{color:#7490a1}
.form-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px}
.sb-import-card{padding:17px 16px 18px}
.sb-import-card .text-input{display:block;width:100%;min-height:54px;border-radius:12px;padding:12px 14px;font-size:20px;letter-spacing:.25px;font-variant-numeric:tabular-nums}
.sb-import-card .primary{display:block;width:100%;min-height:54px;margin-top:14px;border-radius:12px;font-size:14px;font-weight:700;letter-spacing:.25px}
.sb-import-card .text-input::placeholder{color:#91a8b8;opacity:1}
.sb-import-card .message.warn{margin-top:12px}

.primary{border:1px solid var(--blue);background:#329cd2;color:#071b29;border-radius:11px;font-size:12px;font-weight:750;min-height:48px;padding:12px 16px;letter-spacing:.15px}
.primary:disabled{opacity:.5;cursor:wait}
.secondary{border:1px solid #496579;background:#203745;color:#bcd8ea;border-radius:11px;font-size:12px;font-weight:650;min-height:45px;padding:11px 13px}
.stretch{width:100%}
.action-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.action-row>*{flex:1}
.linkish{background:transparent;color:#79caff;border:0;padding:10px 0;font-size:11px}
.message{font-size:11px;color:#99b4c6;margin:10px 0 0;line-height:1.5}
.message.warn{color:var(--amber)}
.notice{background:#2a302e;border:1px solid #756344;border-radius:13px;padding:12px 13px;margin:12px 0;color:#ead5aa;font-size:11px;line-height:1.5}
.note{background:#1a3648;border:1px solid #3c5b71;border-radius:13px;padding:12px;margin:12px 0;color:#a9d7ed;font-size:11px;line-height:1.5}
.route{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:15px 0}
.apt{text-align:center;font-size:28px;font-weight:600;letter-spacing:-.6px;min-width:0}
.plane-line{color:var(--blue);flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px}
.plane-line .icon{display:block;width:24px;height:24px;flex:0 0 24px;stroke-width:1.9;transform:rotate(45deg) scale(.84);transform-origin:center;overflow:visible}
.plane-line:before,.plane-line:after{content:"";height:1px;background:#4b7085;flex:1}
.route-foot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;border-top:1px solid var(--line);padding-top:13px}
.route-foot strong{display:block;margin-top:5px;font-size:13px;font-weight:600}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:11px 0}
.metric{min-height:99px;background:var(--tile);padding:14px 12px;border-radius:15px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-width:0}
.metric .value{font-size:clamp(22px,5.8vw,29px);font-weight:550;white-space:nowrap;letter-spacing:-.7px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.metric .value span{font-size:11px;color:#a3b7c6;letter-spacing:0}
.metric .source{font-size:9px;color:#91a8b8;margin-top:2px}
.metric .value.blue{color:#7cd0fc}
.list-title{font-size:12px;font-weight:600;color:#e9f3fa;letter-spacing:.1px;margin-bottom:12px}
.data-row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #344652;padding:10px 0;gap:10px;font-size:12px}
.data-row:last-child{border-bottom:0}
.data-row span{font-size:10px;color:#a6bbc8}
.data-row strong{font-size:12px;text-align:right;font-weight:550;overflow-wrap:anywhere}
.card-button{display:flex;justify-content:space-between;align-items:center;min-height:68px;padding:14px 16px;width:100%;background:var(--tile);color:#f1f5f9;border:0;border-radius:14px;text-align:left;font-weight:600;font-size:13px;margin-bottom:10px;text-decoration:none}
.card-button svg{color:var(--blue);width:21px;flex:none}
.module-list{display:flex;flex-direction:column;gap:10px}
.module-list .module-card{margin:0;min-height:68px;padding:12px 14px;gap:13px;border-radius:14px;text-decoration:none}
.module-card .module-icon{width:27px;flex:0 0 27px;display:flex;align-items:center;justify-content:center;color:var(--blue)}
.module-card .module-icon .icon{width:23px;height:23px;stroke-width:1.9}
.module-card .module-copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.module-card .module-copy strong{font-size:12px;font-weight:650;letter-spacing:.2px;line-height:1.2;color:#f1f5f9}
.module-card .module-sub{font-size:10px;font-weight:400;color:#91a8b8;letter-spacing:.08px;line-height:1.25}
.module-card .module-chevron{display:flex;align-items:center;color:var(--blue);flex:none}
.module-card .module-chevron .icon{width:18px;height:18px}
@media(max-width:350px){.module-list .module-card{padding:12px;gap:10px}.module-card .module-copy strong{font-size:11px}}

.status{font-size:11px;line-height:1.5;color:#a6bbca}
.status.ok{color:#93ddb3}.status.warn{color:#ecc37e}
.review-summary{padding:16px;margin-bottom:10px}
.review-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--amber);font-size:12px;font-weight:650;letter-spacing:.15px;margin-bottom:8px}
.review-heading .icon{width:18px;height:18px;color:var(--amber);flex:none}
.review-line{padding:9px 0;border-bottom:1px solid var(--line);color:#adc1ce;font-size:11px;line-height:1.35;letter-spacing:.05px}
.review-line:last-child{border-bottom:0}
/* Reviewed OFP: compact by default; full technical notes available per item. */
.review-details .review-detail{border-bottom:1px solid var(--line)}
.review-details .review-detail:last-child{border-bottom:0}
.review-details .review-line{display:flex;align-items:center;justify-content:space-between;gap:10px;list-style:none;cursor:pointer;min-height:41px;border:0;padding:10px 0;color:#adc1ce;font-size:11px;font-weight:500;letter-spacing:.1px}
.review-details .review-line::-webkit-details-marker{display:none}
.review-details .review-line::marker{content:''}
.review-details .review-line .icon{width:16px;height:16px;flex:none;color:#8eaabd;transition:transform .16s ease}
.review-details .review-detail[open] .review-line .icon{transform:rotate(90deg)}
.review-details .review-explanation{margin:0;padding:0 18px 12px 0;color:#9fb5c3;font-size:10px;line-height:1.5;overflow-wrap:anywhere}
.review-details .review-heading{margin-bottom:5px}

.review-action{width:100%;border:0;border-top:1px solid var(--line);background:transparent;color:#bfd9e8;font-size:11px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:13px 0 1px;margin-top:5px;min-height:43px}
.review-action .icon{width:17px;height:17px;color:var(--blue);flex:none}
.comparison-action{min-height:60px;padding:14px 16px;margin-bottom:0;font-size:12px;letter-spacing:.15px;font-weight:600}
.comparison-action .icon{width:19px;height:19px;flex:none}
.review-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:10px;row-gap:16px;margin:14px 0}
.review-grid>div{display:flex;flex-direction:column;min-width:0}
.review-grid label{display:block;white-space:nowrap;min-height:18px;line-height:18px;margin:0 0 8px;font-size:10px;letter-spacing:-.1px}
.review-grid .text-input{display:block;width:100%;height:54px;min-height:54px;padding:10px 12px;border-radius:12px;font-size:20px;line-height:1.25;font-variant-numeric:tabular-nums;appearance:textfield;-moz-appearance:textfield}
.review-grid .text-input::-webkit-outer-spin-button,.review-grid .text-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tab{border:0;border-bottom:2px solid transparent;background:transparent;color:#8fa8ba;font-weight:700;font-size:11px;padding:10px 0}
.tab[aria-selected=true]{color:var(--blue);border-bottom-color:var(--blue)}
.compare-grid{display:grid;grid-template-columns:minmax(0,1.25fr) 1fr 1fr;gap:7px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:11px}
.compare-grid .ofp{text-align:right;color:#d8e3e9;font-variant-numeric:tabular-nums}
.compare-grid .aero{text-align:right;color:#75d0ff;font-variant-numeric:tabular-nums}
.bottom{flex:none;height:66px;background:var(--bg);border-top:1px solid #293946;display:flex;justify-content:space-around;align-items:center;padding:4px 12px 8px;gap:4px}
.nav{border:0;background:transparent;color:#849cad;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;min-width:58px;padding:5px 4px}
.nav .icon{width:20px;height:20px}
.nav.active{color:var(--blue)}
.disclaimer{text-align:center;color:#8ca3b3;letter-spacing:.2px;font-size:9px;line-height:1.5;margin:15px 0 7px}
@media(max-width:355px){.sb-import-card{padding:15px 14px 16px}.sb-import-card .text-input{font-size:19px}.content{padding:15px 11px}.metric .value{font-size:22px}.apt{font-size:24px}.primary{padding:10px}.review-grid{column-gap:8px;row-gap:14px}.review-grid label{font-size:9px;letter-spacing:-.18px}.review-grid .text-input{font-size:19px;padding:10px}}

/* Flight-plan checklist — deliberately visual status, not an operational clearance. */
.checklist{padding:18px 15px 14px;margin-bottom:12px}
.checklist .review-heading{font-size:clamp(12px,3.3vw,14px);font-weight:750;color:var(--amber);letter-spacing:.2px;margin-bottom:10px}
.check-heading-icon{display:flex;align-items:center;justify-content:center;flex:none}
.check-heading-icon .icon{width:21px;height:21px;stroke-width:2.1}
.check-overview{display:flex;justify-content:space-between;align-items:center;color:#a9c2d1;font-size:10px;font-weight:650;letter-spacing:.45px;font-variant-numeric:tabular-nums;margin-bottom:7px}
.check-progress{height:5px;overflow:hidden;border-radius:999px;background:#334756;margin-bottom:12px}
.check-progress>span{height:100%;display:block;background:var(--green);border-radius:999px;transition:width .18s ease}
.check-counts{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
.check-count{font-size:9px;letter-spacing:.25px;border-radius:7px;padding:5px 7px;border:1px solid transparent;display:inline-flex;gap:5px;align-items:center;font-weight:650}
.check-count b{font-size:11px;font-variant-numeric:tabular-nums}
.check-count.status-required{background:#452b2c;border-color:#a94a4e;color:#ffaaa2}
.check-count.status-verify{background:#45392c;border-color:#a47b3f;color:#f0bf75}
.check-count.status-review{background:#1b3447;border-color:#396e9d;color:#8bccf5}
.checklist .review-lines{border-top:1px solid var(--line)}
.checklist .review-detail{border-bottom:1px solid var(--line)}
.checklist .review-detail:last-child{border-bottom:0}
.checklist .review-line{display:flex;align-items:center;gap:8px;min-height:51px;list-style:none;cursor:pointer;padding:9px 0;border:0;color:#d8e5ee}
.checklist .review-line::-webkit-details-marker{display:none}
.checklist .review-line::marker{content:''}
.check-square{width:20px;height:20px;flex:none;border:1.5px solid #66bfee;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#102632}
.check-square .icon{width:16px;height:16px;stroke-width:3}
.check-symbol{width:23px;height:23px;display:grid;place-items:center;flex:none;color:#a9c5d7}
.check-symbol .icon{width:21px;height:21px;stroke-width:1.75}
.check-name{flex:1;min-width:0;font-size:clamp(10px,2.9vw,12px);letter-spacing:.05px;line-height:1.3;font-weight:550;overflow-wrap:anywhere}
.check-badge{border:1px solid transparent;border-radius:8px;padding:6px 7px;min-width:69px;text-align:center;font-size:9px;line-height:1.15;font-weight:750;letter-spacing:.12px;flex:none}
.check-arrow{width:13px;display:flex;align-items:center;flex:none;color:#88a5b7}
.check-arrow .icon{width:14px;height:14px;transition:transform .16s ease}
.check-item[open] .check-arrow .icon{transform:rotate(90deg)}
.check-item.status-required .check-badge{background:#452b2c;border-color:#b84f53;color:#ffaba2}
.check-item.status-verify .check-badge{background:#45392c;border-color:#af8041;color:#f6c57d}
.check-item.status-review .check-badge{background:#1b3447;border-color:#397ba9;color:#99d7ff}
.check-item.status-checked .check-badge{background:#183f35;border-color:#27876e;color:#80e5b8}
.check-item.status-checked .check-square{background:#56b9ee;border-color:#56b9ee}
.check-item.status-checked .check-name{color:#a8bfcd}
.check-item.status-checked .check-symbol{color:#83caaa}
.check-expanded{padding:0 0 13px 51px}
.check-expanded .review-explanation{margin:0 0 11px;padding:0;color:#a7bbcb;font-size:11px;line-height:1.5;overflow-wrap:anywhere}
.check-actions{display:flex;gap:8px;flex-wrap:wrap}
.check-link,.check-confirm{border:1px solid #456a81;border-radius:9px;padding:9px 10px;text-decoration:none;background:#203b4d;color:#9cdcff;font-size:10px;line-height:1.25;font-weight:650;text-align:center;display:inline-flex;align-items:center;justify-content:center;min-height:36px}
.check-confirm{background:#243b35;border-color:#3d7867;color:#9be8c5}
.check-link:focus-visible,.check-confirm:focus-visible,.check-item summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.check-note{color:#8299a8;font-size:9px;letter-spacing:.15px;line-height:1.45;margin:13px 0 0}
.checklist .review-action{margin-top:13px;padding-top:13px}
@media(max-width:355px){
 .checklist{padding:15px 12px}
 .checklist .review-line{gap:5px;min-height:49px}
 .check-square{width:18px;height:18px}
 .check-symbol{width:19px;height:19px}
 .check-symbol .icon{width:19px;height:19px}
 .check-badge{min-width:62px;padding:6px 5px;font-size:8px}
 .check-expanded{padding-left:42px}
}

/* Contextual return from performance / W&B: call out the item just reviewed. */
.check-item.check-return-item{border-left:2px solid #56b9ee;margin-left:-9px;padding-left:7px;background:linear-gradient(90deg,#16374966,transparent 75%)}
.checklist{scroll-margin-top:8px}

.topbar-placeholder{width:38px;height:36px}
.page-back{margin:17px 0 11px;padding-top:13px;border-top:1px solid var(--line)}
.page-back button{width:100%;min-height:58px;display:flex;justify-content:center;align-items:center;background:#243c4d;border:1px solid #456b80;border-radius:13px;padding:12px 14px;color:#dcebf4;font-size:14px;font-weight:700;letter-spacing:.25px}
.page-back button:active{background:#2c4b60}
@media(max-height:730px){.page-back button{min-height:51px}}
</style>
<link rel="stylesheet" href="./ui-buttons.css"></head>
<body><div id="app"></div>
<script src="./takeoff-tables.js"></script><script src="./climb-tables.js"></script><script src="./oei-tables.js"></script><script src="./runway-analysis.js"></script><script src="./wb-engine.js"></script><script src="./simbrief-core.js"></script><script src="./flight-checklist.js"></script><script src="./loading-profile.js"></script><script src="./flight-app.js"></script>
</body></html>
